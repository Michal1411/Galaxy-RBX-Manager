  <rect x="10" y="10" width="740" height="48" rx="23" fill="url(#shine)"/>

  <circle cx="70" cy="63" r="38" fill="#071736" fill-opacity="0.42" stroke="#b7e9ff" stroke-opacity="0.65"/>
  <path d="M70 35v38m0 0L55 58m15 15 15-15M50 84h40" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

